[project]
name = "minutehire-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ujjwalpaliwal", email = "ujjwalpaliwal35@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "huggingface-hub>=1.33.0",
    "onnxruntime>=1.31.0",
    "python-dotenv>=1.2.4",
    "tokenizers>=0.23.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
minutehire-project = "minutehire_project:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
